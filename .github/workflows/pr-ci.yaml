name: PR Build Check

on:
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  changes:
    name: Detect Changed Paths
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      ui: ${{ steps.filter.outputs.ui }}
    steps:
      - name: Filter Changed Paths
        uses: dorny/paths-filter@v3
        id: filter
        with:
          token: ${{ secrets.ACCESS_TOKEN || github.token }}
          filters: |
            backend:
              - 'template-manager-backend/**'
              - 'pom.xml'
              - '.github/workflows/**'
            ui:
              - 'template-manager-ui/**'
              - '.github/workflows/**'

  build-backend:
    name: Build Backend
    needs: changes
    if: ${{ needs.changes.outputs.backend == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Checkout parent-pom
        uses: actions/checkout@v4
        with:
          repository: hvantran/parent-pom
          path: parent-pom
          token: ${{ secrets.ACCESS_TOKEN }}
      
      - name: Checkout base-platform
        uses: actions/checkout@v4
        with:
          repository: hvantran/base-platform
          path: base-platform
          token: ${{ secrets.ACCESS_TOKEN }}
      
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'
      
      - name: Build parent-pom
        run: mvn clean install -f parent-pom/pom.xml -DskipTests
      
      - name: Build base-platform
        run: mvn clean install -f base-platform/pom.xml -DskipTests -Ddockerfile.skip=true
      
      - name: Build backend
        run: mvn clean verify -f template-manager-backend/pom.xml -B -Ddockerfile.skip=true
      
      - name: Run backend tests
        run: mvn test -f template-manager-backend/pom.xml -B
  
  build-ui:
    name: Build UI
    needs: changes
    if: ${{ needs.changes.outputs.ui == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@hvantran'
          cache: 'yarn'
          cache-dependency-path: template-manager-ui/yarn.lock

      - name: Install dependencies
        working-directory: template-manager-ui
        run: yarn install
        env:
          NODE_AUTH_TOKEN: ${{ secrets.ACCESS_TOKEN || secrets.GITHUB_TOKEN }}
      
      - name: Setup environment
        working-directory: template-manager-ui
        run: |
          chmod +x ./env.sh
          ./env.sh || echo "REACT_APP_API_URL=http://localhost:8080" > .env
          if [ -f env-config.js ]; then mv env-config.js ./public/; fi
      
      - name: Build UI
        working-directory: template-manager-ui
        run: yarn build
        env:
          CI: false
      
      - name: Run UI tests
        working-directory: template-manager-ui
        run: yarn test --passWithNoTests --watchAll=false
