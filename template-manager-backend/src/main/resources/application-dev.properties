# Setting Spring context path & port
server.servlet.context-path=/${template.manager.service.name}
server.port=8084

# DevTools Configuration for Auto-Reload
spring.devtools.restart.enabled=true
spring.devtools.restart.additional-paths=src/main/java
spring.devtools.restart.exclude=static/**,public/**
spring.devtools.livereload.enabled=true

# Disable template caching for dev mode
spring.freemarker.cache=false

# MongoDB settings
spring.data.mongodb.uri=mongodb://localhost:27017/template-manager?directConnection=true&serverSelectionTimeoutMS=2000
spring.main.allow-bean-definition-overriding=true